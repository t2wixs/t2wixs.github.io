<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supabase Auth</title>
</head>
<body>
  <h1>Регистрация и вход</h1>

  <p id="authStatus">Проверяю сессию…</p>

  <h2>Sign up</h2>
  <form id="signUpForm">
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Пароль" required minlength="6">
    <button type="submit">Зарегистрироваться</button>
  </form>

  <h2>Sign in</h2>
  <form id="signInForm">
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Пароль" required>
    <button type="submit">Войти</button>
  </form>

  <p id="message" role="status"></p>

  <button id="loadButton" type="button" disabled>Загрузить user</button>
  <button id="signOutButton" type="button" disabled>Выйти</button>

  <pre id="results"></pre>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const client = supabase.createClient(
      "https://lzvafutsflrtrjgbudsf.supabase.co",
      "sb_publishable_jpbsrMKWzL7FR-FkeRzOjg_ElIDrHZj"
    );

    const authStatus = document.getElementById("authStatus");
    const message = document.getElementById("message");
    const results = document.getElementById("results");
    const loadButton = document.getElementById("loadButton");
    const signOutButton = document.getElementById("signOutButton");

    function showUser(user) {
      if (user) {
        authStatus.textContent = `Вы вошли как ${user.email}`;
        loadButton.disabled = false;
        signOutButton.disabled = false;
      } else {
        authStatus.textContent = "Вы не вошли";
        loadButton.disabled = true;
        signOutButton.disabled = true;
      }
    }

    async function loadUsers() {
      const { data, error } = await client
        .from("user")
        .select("*");

      if (error) {
        message.textContent = `Ошибка загрузки: ${error.message}`;
        return;
      }

      results.textContent = JSON.stringify(data, null, 2);
      message.textContent = `Загружено записей: ${data.length}`;
    }

    document.getElementById("signUpForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      const formData = new FormData(event.currentTarget);
      const email = formData.get("email");
      const password = formData.get("password");

      const { data, error } = await client.auth.signUp({ email, password });

      if (error) {
        message.textContent = `Ошибка регистрации: ${error.message}`;
        return;
      }

      if (data.session) {
        showUser(data.user);
        message.textContent = "Аккаунт создан, вы вошли.";
      } else {
        message.textContent =
          "Регистрация отправлена. Проверьте почту и подтвердите email, затем войдите.";
      }
    });

    document.getElementById("signInForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      const formData = new FormData(event.currentTarget);
      const email = formData.get("email");
      const password = formData.get("password");

      const { data, error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = `Ошибка входа: ${error.message}`;
        return;
      }

      showUser(data.user);
      message.textContent = "Вы вошли.";
    });

    loadButton.addEventListener("click", loadUsers);

    signOutButton.addEventListener("click", async () => {
      const { error } = await client.auth.signOut();

      if (error) {
        message.textContent = `Ошибка выхода: ${error.message}`;
        return;
      }

      showUser(null);
      results.textContent = "";
      message.textContent = "Вы вышли из аккаунта.";
    });

    // Проверяем, есть ли уже активная сессия
    client.auth.getSession().then(({ data, error }) => {
      if (error) {
        authStatus.textContent = `Ошибка проверки сессии: ${error.message}`;
        return;
      }

      showUser(data.session?.user ?? null);
    });

    // Обновляем отображение при изменении состояния авторизации
    client.auth.onAuthStateChange((_event, session) => {
      showUser(session?.user ?? null);
    });
  </script>
</body>
</html>
