<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и Регистрация</title>
    
    <!-- 1. Подключаем библиотеку Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Стили (CSS) -->
    <style>
        :root {
            --primary-color: #3ECF8E; /* Зеленый Supabase */
            --primary-hover: #36b37e;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --border-color: #ddd;
            --danger-color: #e74c3c;
            --github-color: #24292e; /* Темный GitHub */
            --github-hover: #1b1f23;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 20px;
            font-size: 24px;
        }

        .status {
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
            color: #666;
        }

        .status span {
            font-weight: bold;
            color: var(--primary-color);
            word-break: break-all;
        }

        h2 {
            font-size: 18px;
            color: var(--text-color);
            margin-bottom: 15px;
            margin-top: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* Стили для кнопки GitHub */
        .btn-github {
            background-color: var(--github-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 0; /* Убираем отступ снизу для кнопки GitHub */
        }

        .btn-github:hover {
            background-color: var(--github-hover);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-size: 14px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        .message {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
            word-break: break-word;
        }

        .message.error { color: var(--danger-color); }
        .message.success { color: var(--primary-color); }

        .hidden { display: none; }

        .btn-secondary {
            background-color: #f0f0f0;
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Добро пожаловать</h1>
    
    <div class="status" id="status-text">Проверка авторизации...</div>

    <!-- Блок авторизованного пользователя -->
    <div id="logged-in-view" class="hidden">
        <p style="text-align: center; margin-bottom: 20px;">
            Вы успешно вошли в систему.
        </p>
        <button onclick="loadUserData()">Загрузить данные</button>
        <button class="btn-secondary" onclick="signOut()">Выйти</button>
        <div class="message" id="data-message"></div>
    </div>

    <!-- Блок формы Входа/Регистрации -->
    <div id="auth-view">
        
        <!-- Кнопка входа через GitHub -->
        <button class="btn-github" onclick="signInWithGitHub()">
            <svg height="20" viewBox="0 0 16 16" width="20" fill="white">
                <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
            Войти через GitHub
        </button>

        <div class="divider">или</div>

        <h2>Вход</h2>
        <div class="input-group">
            <input type="email" id="login-email" placeholder="Email">
        </div>
        <div class="input-group">
            <input type="password" id="login-password" placeholder="Пароль">
        </div>
        <button onclick="signIn()">Войти</button>

        <h2>Регистрация</h2>
        <div class="input-group">
            <input type="email" id="signup-email" placeholder="Email">
        </div>
        <div class="input-group">
            <input type="password" id="signup-password" placeholder="Пароль">
        </div>
        <button onclick="signUp()">Зарегистрироваться</button>
    </div>

    <div class="message" id="auth-message"></div>
</div>

<script>
    // --- ИНИЦИАЛИЗАЦИЯ ---
    const SUPABASE_URL = "https://tavghdrgocxqbcpxmpmk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_6IWNSolFd6yguQMkyeOUEA_-8f68GwO";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- ЭЛЕМЕНТЫ ИНТЕРФЕЙСА ---
    const authView = document.getElementById('auth-view');
    const loggedInView = document.getElementById('logged-in-view');
    const statusText = document.getElementById('status-text');
    const authMessage = document.getElementById('auth-message');
    const dataMessage = document.getElementById('data-message');

    // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
    function showMessage(element, text, isError = false) {
        element.textContent = text;
        element.className = 'message ' + (isError ? 'error' : 'success');
    }

    function clearMessage(element) {
        element.textContent = '';
        element.className = 'message';
    }

    function updateUI(user) {
        if (user) {
            // Берем email или имя пользователя из метаданных (для GitHub)
            const displayName = user.email || (user.user_metadata && user.user_metadata.user_name) || 'Пользователь';
            statusText.innerHTML = `Вы вошли как <span>${displayName}</span>`;
            authView.classList.add('hidden');
            loggedInView.classList.remove('hidden');
        } else {
            statusText.textContent = 'Вы не авторизованы.';
            authView.classList.remove('hidden');
            loggedInView.classList.add('hidden');
            clearMessage(dataMessage);
        }
    }

    // --- ЛОГИКА АВТОРИЗАЦИИ ---

    // Вход через GitHub
    async function signInWithGitHub() {
        clearMessage(authMessage);
        const { data, error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'github',
            options: {
                // После входа GitHub вернет пользователя на эту же страницу
                redirectTo: window.location.origin + window.location.pathname 
            }
        });

        if (error) {
            showMessage(authMessage, 'Ошибка входа через GitHub: ' + error.message, true);
        }
    }

    // Проверка сессии при загрузке страницы
    async function checkSession() {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (session) {
            updateUI(session.user);
        } else {
            updateUI(null);
        }
    }

    // Вход по Email
    async function signIn() {
        clearMessage(authMessage);
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        if (!email || !password) {
            showMessage(authMessage, 'Заполните email и пароль', true);
            return;
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password,
        });

        if (error) {
            showMessage(authMessage, 'Ошибка входа: ' + error.message, true);
        } else {
            updateUI(data.user);
        }
    }

    // Регистрация по Email
    async function signUp() {
        clearMessage(authMessage);
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;

        if (!email || !password) {
            showMessage(authMessage, 'Заполните email и пароль', true);
            return;
        }

        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
        });

        if (error) {
            showMessage(authMessage, 'Ошибка регистрации: ' + error.message, true);
        } else {
            showMessage(authMessage, 'Успешно! Проверьте почту для подтверждения.', false);
            // Если в настройках Supabase отключено подтверждение почты, пользователь войдет сразу
            if (data.session) {
                updateUI(data.user);
            }
        }
    }

    // Выход
    async function signOut() {
        await supabaseClient.auth.signOut();
        updateUI(null);
        showMessage(authMessage, 'Вы вышли из системы.', false);
    }

    // --- РАБОТА С БАЗОЙ ДАННЫХ ---

    async function loadUserData() {
        clearMessage(dataMessage);
        showMessage(dataMessage, 'Загрузка...', false);

        const { data: { user } } = await supabaseClient.auth.getUser();
        
        if (!user) return;

        // Ищем данные в таблице users по ID текущего пользователя
        const { data, error } = await supabaseClient
            .from('users')
            .select('*')
            .eq('id', user.id) 
            .single();

        if (error) {
            showMessage(dataMessage, 'Данные в таблице не найдены (или ошибка RLS).', true);
            console.error(error);
        } else {
            // Выводим полученные данные в виде строки JSON
            showMessage(dataMessage, `Данные: ${JSON.stringify(data)}`, false);
        }
    }

    // --- ЗАПУСК ---
    checkSession();
</script>

</body>
</html>
